<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- fundo arredondado -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- caixa / pacote de locação -->
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- topo da caixa -->
    <path d="M32 14 L50 23 L32 32 L14 23 Z" fill="#ffffff" fill-opacity="0.15"/>
    <!-- lados da caixa -->
    <path d="M14 23 L14 41 L32 50 L32 32 Z" fill="#ffffff" fill-opacity="0.10"/>
    <path d="M50 23 L50 41 L32 50 L32 32 Z" fill="#ffffff" fill-opacity="0.25"/>
  </g>

  <!-- tag de preço/aluguel -->
  <g>
    <path d="M38 38 L52 38 L52 47 L45 54 L38 47 Z" fill="#facc15" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="45" cy="44" r="2.2" fill="#15803d"/>
  </g>
</svg>
